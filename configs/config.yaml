project:
  num_classes: 52
  feature_dim: 291
  fixed_length: 100

model:
  d_model: 160
  num_heads: 4
  num_layers: 4
  d_ff: 256
  dropout: 0.35

paths:
  dataset: data/final_dataset
  class_mapping: data/metadata/class_mapping.json
  checkpoint: models/gesture_transformer/best/best_model3.pth
  sentence_log: logs/detected_sentences.txt
  # ...existing entries...
  context_json: data/context/scene_context.json

device:
  use_cuda: true

recognition:
  min_frames: 15            # shorter clips are discarded as noise
  max_frames: 90            # force-classify a clip this long (must be <= project.fixed_length)
  preroll_frames: 5         # frames kept from before motion started
  tail_frames: 3            # still frames kept after the last motion
  preview_interval: 6       # live guess every N frames (display only, never commits)
  accept_confidence: 0.50   # tune on validation data
  min_margin: 0.20          # top-1 must beat top-2 by this much

motion:
  velocity_threshold: 0.004
  start_frames: 3           # moving frames needed...
  start_window: 5           # ...out of this many recent frames
  smoothing: 0.5
  require_raised_hands: true
  use_hip_line: false       # true = use hip position as the resting line when hips are visible
  rest_line: 0.9            # wrist y (0 = top, 1 = bottom) below which a hand counts as resting
  word_pause_seconds: 0.4
  sentence_pause_seconds: 1.2

context:
  model: ViT-B/32
  scene_interval_seconds: 3.0   # how often a frame is analyzed
  smoothing_window: 2           # average the last N detections to stop the scene flickering
  object_top_k: 3               # objects listed in visual_context
  object_min_similarity: 0.20   # minimum CLIP match for an object to be listed
